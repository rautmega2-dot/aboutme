<style>
@property --ang{syntax:"<angle>";initial-value:0deg;inherits:false}
:root{--bg:#05070f;--blue:#3da0ff;--cy:#5ee7ff;--vio:#7846ff;--pk:#ff5ccf;--tx:#e8f0ff;--mute:#9db0d3;--live:#35f08a;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--tx);font:500 17px/1.55 "Space Grotesk",system-ui,sans-serif;background:var(--bg);overflow-x:hidden}
::selection{background:var(--blue);color:#fff}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:linear-gradient(var(--blue),var(--vio));border-radius:8px}::-webkit-scrollbar-track{background:#05070f}

/* ---------- background stack ---------- */
.aurora{position:fixed;inset:0;z-index:-3;overflow:hidden;background:var(--bg)}
.aurora i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;mix-blend-mode:screen;will-change:transform}
.aurora .a1{width:560px;height:560px;left:-12%;top:-8%;background:#1f5fff;animation:ab1 18s ease-in-out infinite}
.aurora .a2{width:480px;height:480px;right:-14%;top:22%;background:#12b6d6;opacity:.35;animation:ab2 22s ease-in-out infinite}
.aurora .a3{width:560px;height:560px;left:8%;bottom:-18%;background:#6b3bff;opacity:.45;animation:ab3 26s ease-in-out infinite}
.aurora .a4{width:360px;height:360px;right:6%;bottom:6%;background:#ff3fb8;opacity:.18;animation:ab1 30s ease-in-out infinite reverse}
@keyframes ab1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(120px,90px) scale(1.25)}}
@keyframes ab2{0%,100%{transform:translate(0,0) scale(1.1)}50%{transform:translate(-140px,60px) scale(.85)}}
@keyframes ab3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(110px,-120px) scale(1.2)}}
.grid{position:fixed;inset:0;z-index:-2;pointer-events:none;
  background-image:linear-gradient(rgba(94,231,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(94,231,255,.07) 1px,transparent 1px);
  background-size:52px 52px;animation:gridmove 9s linear infinite;
  -webkit-mask-image:radial-gradient(ellipse 75% 65% at 50% 38%,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse 75% 65% at 50% 38%,#000 20%,transparent 75%)}
@keyframes gridmove{to{background-position:52px 52px}}
#net{position:fixed;inset:0;z-index:-1;pointer-events:none}
.cur{position:fixed;left:0;top:0;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;pointer-events:none;z-index:0;opacity:0;transition:opacity .4s;
  background:radial-gradient(circle,rgba(61,160,255,.20),rgba(120,70,255,.08) 40%,transparent 68%);will-change:transform}
.cur.on{opacity:1}
.bar{position:fixed;left:0;top:0;height:3px;width:100%;z-index:60;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--cy),var(--blue),var(--vio),var(--pk));box-shadow:0 0 14px var(--blue)}

/* ---------- layout ---------- */
.wrap{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:44px 18px 40px}
.top{text-align:center}

/* logo: spinning energy ring + orbiting sparks */
.lg{position:relative;width:150px;height:150px;margin:0 auto 26px;perspective:700px;animation:logoIn 1s cubic-bezier(.2,1.5,.4,1) both}
.lg .tilt{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .15s ease-out}
.lg::before{content:"";position:absolute;inset:-12px;border-radius:50%;background:conic-gradient(var(--cy),var(--blue),var(--vio),var(--pk),var(--cy));
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));
  animation:spin 5s linear infinite;filter:drop-shadow(0 0 8px var(--blue))}
.lg::after{content:"";position:absolute;inset:-26px;border-radius:50%;border:1px dashed rgba(94,231,255,.35);animation:spin 18s linear infinite reverse}
.lg .orb{position:absolute;inset:-26px;border-radius:50%;animation:spin 6s linear infinite}
.lg .orb b{position:absolute;left:50%;top:-5px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--cy);box-shadow:0 0 14px 3px var(--cy)}
.lg .orb.o2{inset:-12px;animation-duration:9s;animation-direction:reverse}
.lg .orb.o2 b{background:var(--pk);box-shadow:0 0 14px 3px var(--pk);top:auto;bottom:-5px}
.logo{width:150px;height:150px;border-radius:50%;border:2px solid rgba(94,231,255,.7);display:block;object-fit:cover;
  box-shadow:0 0 0 6px rgba(61,160,255,.12),0 0 40px rgba(61,160,255,.6),0 0 90px rgba(61,160,255,.25);animation:floaty 5s ease-in-out infinite,glowp 3s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes glowp{0%,100%{box-shadow:0 0 0 6px rgba(61,160,255,.12),0 0 34px rgba(61,160,255,.55),0 0 80px rgba(61,160,255,.2)}50%{box-shadow:0 0 0 10px rgba(61,160,255,.18),0 0 56px rgba(94,231,255,.8),0 0 120px rgba(120,70,255,.4)}}
@keyframes logoIn{from{opacity:0;transform:scale(.2) rotate(-180deg)}}

/* brand name: moving gradient + glitch */
.nm{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
h1{position:relative;margin:0;font-size:clamp(38px,11vw,60px);line-height:1.05;font-weight:700;letter-spacing:-.02em;
  background:linear-gradient(100deg,#fff 0%,#9fc6ff 25%,var(--blue) 45%,var(--cy) 60%,#fff 80%,#9fc6ff 100%);background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(61,160,255,.45));
  animation:shimmer 6s linear infinite,blurIn 1s .35s cubic-bezier(.2,1,.3,1) both}
h1::before,h1::after{content:attr(data-t);position:absolute;inset:0;background:none;-webkit-text-fill-color:currentColor;opacity:0;pointer-events:none}
h1::before{color:var(--cy);animation:gl1 5s steps(1) 2s infinite}
h1::after{color:var(--pk);animation:gl2 5s steps(1) 2s infinite}
@keyframes shimmer{to{background-position:-250% 0}}
@keyframes blurIn{from{opacity:0;filter:blur(18px);letter-spacing:.2em}}
@keyframes gl1{0%,100%{opacity:0}2%{opacity:.9;transform:translate(-4px,0);clip-path:inset(10% 0 55% 0)}4%{opacity:.9;transform:translate(3px,0);clip-path:inset(60% 0 8% 0)}6%{opacity:0}}
@keyframes gl2{0%,100%{opacity:0}3%{opacity:.9;transform:translate(4px,0);clip-path:inset(50% 0 20% 0)}5%{opacity:.9;transform:translate(-3px,0);clip-path:inset(5% 0 70% 0)}7%{opacity:0}}

.live{display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 10px;border-radius:999px;font:500 13px "JetBrains Mono",monospace;color:var(--live);
  background:rgba(53,240,138,.1);border:1px solid rgba(53,240,138,.45);box-shadow:0 0 18px rgba(53,240,138,.35);animation:popIn .7s .8s cubic-bezier(.2,1.6,.4,1) both}
.live i{width:9px;height:9px;border-radius:50%;background:var(--live);box-shadow:0 0 10px var(--live);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(53,240,138,.8)}70%{box-shadow:0 0 0 10px rgba(53,240,138,0)}100%{box-shadow:0 0 0 0 rgba(53,240,138,0)}}
@keyframes popIn{from{opacity:0;transform:scale(.3)}}
.role{font:500 15px "JetBrains Mono",monospace;color:var(--cy);margin:14px 0 0;min-height:1.55em;text-shadow:0 0 14px rgba(94,231,255,.6)}
.role::after{content:"_";animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* ticker */
.mq{margin:26px -18px 0;overflow:hidden;white-space:nowrap;border-block:1px solid rgba(140,185,255,.18);background:rgba(255,255,255,.03);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.mq div{display:inline-block;padding:9px 0;font:500 13px "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);animation:run 28s linear infinite}
.mq span{color:var(--cy);margin:0 14px}
@keyframes run{to{transform:translateX(-50%)}}

/* ---------- glass + mouse spotlight ---------- */
.glass{position:relative;background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.03));border:1px solid rgba(140,185,255,.22);border-radius:20px;
  -webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);
  box-shadow:0 8px 32px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.18)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.16),transparent 60%)}
.glass:hover::after{opacity:1}

/* scroll reveal */
.js .rv{opacity:0;translate:0 46px;scale:.96;filter:blur(10px);transition:opacity .8s cubic-bezier(.2,.9,.3,1),translate .8s cubic-bezier(.2,.9,.3,1),scale .8s cubic-bezier(.2,.9,.3,1),filter .8s;transition-delay:var(--d,0ms)}
.js .rv.l{translate:-50px 0}.js .rv.r{translate:50px 0}
.js .rv.in{opacity:1;translate:0 0;scale:1;filter:none}

.about{padding:18px 20px;margin:26px 0;color:var(--mute)}
.about b{display:block;color:var(--tx);font-size:20px;margin-bottom:4px}
.about p{margin:0}
.about::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:3px;border-radius:3px;background:linear-gradient(var(--cy),var(--vio));box-shadow:0 0 12px var(--cy)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{padding:14px 10px;text-align:center;transition:transform .25s,box-shadow .25s}
.stat:hover{transform:translateY(-5px);box-shadow:0 14px 40px rgba(0,0,0,.5),0 0 30px rgba(61,160,255,.35),inset 0 1px 0 rgba(255,255,255,.2)}
.stat b{display:block;font-size:clamp(18px,5.5vw,26px);line-height:1.1;color:#fff;text-shadow:0 0 16px rgba(61,160,255,.8);font-variant-numeric:tabular-nums}
.stat span{display:block;margin-top:4px;font-size:13px;color:var(--mute);line-height:1.3}

h2{position:relative;display:inline-block;font-size:clamp(22px,6vw,28px);margin:40px 0 16px;letter-spacing:-.01em}
h2::after{content:"";position:absolute;left:0;bottom:-6px;height:3px;width:0;border-radius:3px;background:linear-gradient(90deg,var(--cy),var(--vio),var(--pk));box-shadow:0 0 12px var(--blue);transition:width .9s .3s cubic-bezier(.2,1,.3,1)}
h2.in::after{width:64px}

/* project cards */
#links{display:grid;gap:18px}
.card{--c:var(--blue);padding:18px 18px 16px;border-color:color-mix(in srgb,var(--c) 45%,transparent);
  transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .18s ease-out,box-shadow .3s}
.card::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:2px;pointer-events:none;opacity:.5;transition:opacity .3s;
  background:conic-gradient(from var(--ang),transparent 0 55%,var(--c) 85%,#fff 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
  animation:ang 4s linear infinite}
@keyframes ang{to{--ang:360deg}}
.card:hover{box-shadow:0 8px 32px rgba(0,0,0,.45),0 0 34px color-mix(in srgb,var(--c) 45%,transparent),inset 0 1px 0 rgba(255,255,255,.2)}
.card:hover::before{opacity:1}
.card .n{font-size:21px;font-weight:700;line-height:1.2}
.card .d{color:var(--mute);margin:4px 0 14px;font-size:15.5px}

.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:999px;text-decoration:none;color:#fff;font-weight:700;
  background:linear-gradient(145deg,color-mix(in srgb,var(--c) 85%,#fff 0%),color-mix(in srgb,var(--c) 40%,#000));
  border:1px solid rgba(255,255,255,.4);box-shadow:0 0 22px color-mix(in srgb,var(--c) 55%,transparent),inset 0 1px 0 rgba(255,255,255,.5);
  transition:transform .15s,box-shadow .15s;-webkit-tap-highlight-color:transparent}
.btn::before{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:sweep 3.4s ease-in-out infinite}
@keyframes sweep{0%,55%{left:-70%}100%{left:140%}}
.btn .arr{display:inline-block;transition:transform .2s}
.btn:hover .arr{transform:translateX(5px)}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 34px color-mix(in srgb,var(--c) 80%,transparent),inset 0 1px 0 rgba(255,255,255,.6)}
.btn:active{transform:scale(.96)}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);pointer-events:none;animation:rip .6s ease-out forwards}
@keyframes rip{to{transform:scale(1);opacity:0}}

/* services */
.svc{display:grid;gap:12px}
.svc div.glass{display:flex;align-items:center;gap:16px;padding:14px 18px;transition:transform .25s,box-shadow .25s}
.svc div.glass:hover{transform:translateX(6px);box-shadow:0 8px 32px rgba(0,0,0,.45),0 0 26px rgba(61,160,255,.3),inset 0 1px 0 rgba(255,255,255,.2)}
.svc .no{flex:none;font:700 34px/1 "Space Grotesk",sans-serif;color:transparent;-webkit-text-stroke:1.5px rgba(94,231,255,.7);min-width:2ch;transition:color .3s,text-shadow .3s}
.svc div.glass:hover .no{color:var(--cy);text-shadow:0 0 18px var(--cy)}
.svc b{display:block;font-size:18px}
.svc span.t{color:var(--mute);font-size:15.5px}
:focus-visible{outline:3px solid var(--cy);outline-offset:3px}
footer{margin-top:44px;text-align:center;color:var(--mute);font-size:14px}
footer i{display:inline-block;width:7px;height:7px;margin-right:8px;border-radius:50%;background:var(--live);box-shadow:0 0 10px var(--live);animation:pulse 1.6s infinite}

/* back to top */
#up{position:fixed;right:16px;bottom:18px;z-index:40;width:46px;height:46px;border-radius:50%;border:1px solid rgba(140,185,255,.4);color:#fff;font-size:20px;cursor:pointer;
  background:linear-gradient(145deg,rgba(61,160,255,.5),rgba(120,70,255,.4));-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 0 22px rgba(61,160,255,.5);
  opacity:0;translate:0 20px;pointer-events:none;transition:opacity .3s,translate .3s,transform .15s}
#up.on{opacity:1;translate:0 0;pointer-events:auto}
#up:hover{transform:translateY(-3px)}

/* click sparks */
.sp{position:fixed;z-index:80;width:8px;height:8px;border-radius:50%;pointer-events:none;animation:spark .75s ease-out forwards}
@keyframes spark{to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}

@media (max-width:480px){.stats{grid-template-columns:1fr}.stat{display:flex;align-items:baseline;gap:10px;text-align:left;padding:12px 16px}.cur{display:none}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .js .rv{opacity:1!important;translate:none!important;scale:none!important;filter:none!important}
  h2::after{width:64px}.cur,#net{display:none}
}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i class="a1"></i><i class="a2"></i><i class="a3"></i><i class="a4"></i></div>
<div class="grid" aria-hidden="true"></div>

<main class="wrap">

    <div class="lg" id="lg">
      <div class="orb"><b></b></div><div class="orb o2"><b></b></div>
      <div class="tilt"><img class="logo" src="logo.jpg" alt="Eren Empire logo" width="150" height="150"></div>

    <div class="nm"><h1 id="brand">Eren Empire</h1><span class="live"><i></i>LIVE</span></div>

  </header>
  <div class="mq" id="mq" aria-hidden="true"></div>
  <div class="about glass rv"><b id="name"></b><p id="about"></p></div>
  <div class="stats" id="stats"></div>
  <h2 class="rv">Projects</h2>
  <nav id="links" aria-label="Links">
    <noscript><a class="btn" href="https://t.me/erenygr58">Message Me</a></noscript>
  </nav>
  <h2 class="rv">What I build</h2>
  <div class="svc" id="svc"></div>
  <footer class="rv"><i></i>© 2026 Eren Empire</footer>
</main>
<button id="up" aria-label="Back to top">↑</button>

<script src="links.js"></script>
<script>
var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
var fine = matchMedia("(hover:hover) and (pointer:fine)").matches;
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x)e.textContent=x;return e}
function $(id){return document.getElementById(id)}

/* ---- text ---- */
$("brand").textContent = SITE.brand; $("brand").setAttribute("data-t", SITE.brand);
$("name").textContent = "Hi, I’m " + SITE.name;
$("about").textContent = SITE.about;
var role = $("title"), rt = String(SITE.title || "");
if (reduce) role.textContent = rt;
else { var ri = 0; setTimeout(function f(){ role.textContent = rt.slice(0, ++ri); if (ri < rt.length) setTimeout(f, 38); }, 1000); }

/* ---- count-up numbers ---- */
function countUp(b){
  var txt = b.getAttribute("data-n"), m = /^([^\d]*)(\d[\d,]*\.?\d*)(.*)$/.exec(txt);
  if (!m || reduce) { b.textContent = txt; return; }
  var raw = m[2].replace(/,/g, ""), val = parseFloat(raw), dec = (raw.split(".")[1] || "").length, comma = m[2].indexOf(",") > -1;
  function fmt(v){ var s = v.toFixed(dec); if (comma){ var p = s.split("."); p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ","); s = p.join("."); } return m[1] + s + m[3]; }
  var t0 = performance.now(), D = 1500;
  (function step(t){ var k = Math.min(1, (t - t0) / D), e = 1 - Math.pow(1 - k, 4); b.textContent = fmt(val * e); if (k < 1) requestAnimationFrame(step); else b.textContent = txt; })(t0);
}

/* ---- build sections ---- */
if (typeof STATS !== "undefined") STATS.forEach(function(i, k){
  var d = el("div", "stat glass rv"); d.style.setProperty("--d", k * 120 + "ms");
  var b = el("b", "", i.n); b.setAttribute("data-n", i.n); b.className = "cnt"; d.appendChild(b); d.appendChild(el("span", "", i.l)); $("stats").appendChild(d);
});
if (typeof SERVICES !== "undefined") {
  SERVICES.forEach(function(i, k){
    var d = el("div", "glass rv " + (k % 2 ? "r" : "l")); d.style.setProperty("--d", (k % 3) * 90 + "ms");
    d.appendChild(el("div", "no", (k + 1 < 10 ? "0" : "") + (k + 1)));
    var w = el("div"); w.appendChild(el("b", "", i.name)); w.appendChild(el("span", "t", i.desc)); d.appendChild(w); $("svc").appendChild(d);
  });
  /* ticker made from the service names */
  var half = ""; for (var r = 0; r < 3; r++) SERVICES.forEach(function(s){ half += s.name + "\u0001"; });
  var inner = el("div"); var parts = (half + half).split("\u0001"); parts.pop();
  parts.forEach(function(p){ inner.appendChild(document.createTextNode(p)); inner.appendChild(el("span", "", "✦")); });
  $("mq").appendChild(inner);
} else $("mq").style.display = "none";

LINKS.forEach(function(l, k){
  var c = el("div", "card glass rv"); c.style.setProperty("--d", (k % 3) * 100 + "ms"); if (l.color) c.style.setProperty("--c", l.color);
  c.appendChild(el("div", "n", l.name)); if (l.desc) c.appendChild(el("div", "d", l.desc));
  var a = el("a", "btn", l.button || "Open"); a.href = l.url; a.target = "_blank"; a.rel = "noopener";
  a.appendChild(el("span", "arr", "→")); c.appendChild(a); $("links").appendChild(c);
});

/* ---- scroll reveal (+ count-up when a number appears) ---- */
var rvs = document.querySelectorAll(".rv");
function reveal(n){ n.classList.add("in"); var b = n.querySelector && n.querySelector(".cnt"); if (b) countUp(b); }
if ("IntersectionObserver" in window && !reduce) {
  var io = new IntersectionObserver(function(es){ es.forEach(function(e){ if (e.isIntersecting){ reveal(e.target); io.unobserve(e.target); } }); }, {threshold: .1});
  rvs.forEach(function(n){ io.observe(n); });
  setTimeout(function(){ rvs.forEach(function(n){ if (!n.classList.contains("in")) { var r = n.getBoundingClientRect(); if (r.top < innerHeight) reveal(n); } }); }, 2500);
} else rvs.forEach(reveal);

/* ---- pointer effects ---- */
var raf = 0, px = 0, py = 0, tgt = null;
document.addEventListener("pointermove", function(e){
  px = e.clientX; py = e.clientY; tgt = e.target;
  if (!raf) raf = requestAnimationFrame(frame);
});
function frame(){
  raf = 0;
  var g = tgt && tgt.closest && tgt.closest(".glass");
  if (g) { var r = g.getBoundingClientRect(); g.style.setProperty("--mx", (px - r.left) + "px"); g.style.setProperty("--my", (py - r.top) + "px");
    if (fine && g.classList.contains("card")) { g.style.setProperty("--ry", ((px - r.left) / r.width - .5) * 9 + "deg"); g.style.setProperty("--rx", -((py - r.top) / r.height - .5) * 9 + "deg"); } }
  if (fine) { var cu = $("cur"); cu.style.transform = "translate(" + px + "px," + py + "px)"; cu.classList.add("on"); }
  var lg = $("lg"); lg.style.setProperty("--ry", (px / innerWidth - .5) * 28 + "deg"); lg.style.setProperty("--rx", -(py / innerHeight - .5) * 28 + "deg");
}
document.addEventListener("pointerout", function(e){
  var c = e.target.closest && e.target.closest(".card"); if (c && !c.contains(e.relatedTarget)) { c.style.setProperty("--rx", "0deg"); c.style.setProperty("--ry", "0deg"); }
});

/* ---- sparks + ripple on every button ---- */
document.addEventListener("click", function(e){
  var b = e.target.closest && e.target.closest(".btn"); if (!b || reduce) return;
  var r = b.getBoundingClientRect(), s = Math.max(r.width, r.height) * 2, p = el("span", "rip");
  p.style.cssText = "width:" + s + "px;height:" + s + "px;left:" + (e.clientX - r.left - s / 2) + "px;top:" + (e.clientY - r.top - s / 2) + "px"; b.appendChild(p); setTimeout(function(){ p.remove(); }, 650);
  var col = getComputedStyle(b).getPropertyValue("--c").trim() || "#3da0ff", cols = [col, "#5ee7ff", "#fff", "#ff5ccf", "#7846ff"];
  for (var i = 0; i < 18; i++) {
    var d = el("i", "sp"), a = Math.random() * 6.283, dist = 50 + Math.random() * 90;
    d.style.left = e.clientX + "px"; d.style.top = e.clientY + "px"; d.style.background = cols[i % cols.length]; d.style.boxShadow = "0 0 10px " + cols[i % cols.length];
    d.style.setProperty("--x", Math.cos(a) * dist + "px"); d.style.setProperty("--y", Math.sin(a) * dist + "px"); document.body.appendChild(d); setTimeout(function(x){ x.remove(); }, 800, d);
  }
});

/* ---- scroll progress + back to top ---- */
var up = $("up"), bar = $("bar"), sraf = 0;
function sc(){ sraf = 0; var h = document.documentElement.scrollHeight - innerHeight; bar.style.transform = "scaleX(" + (h > 0 ? scrollY / h : 0) + ")"; up.classList.toggle("on", scrollY > 500); }
addEventListener("scroll", function(){ if (!sraf) sraf = requestAnimationFrame(sc); }, {passive: true}); sc();
up.addEventListener("click", function(){ scrollTo({top: 0, behavior: reduce ? "auto" : "smooth"}); });

/* ---- particle network (reacts to the pointer) ---- */
(function(){
  if (reduce) return;
  var c = $("net"), x = c.getContext("2d"), W, H, P = [], mx = -999, my = -999, dpr = Math.min(devicePixelRatio || 1, 2), vis = true;
  function size(){
    W = innerWidth; H = innerHeight; c.width = W * dpr; c.height = H * dpr; c.style.width = W + "px"; c.style.height = H + "px"; x.setTransform(dpr, 0, 0, dpr, 0, 0);
    var n = Math.round(Math.min(80, Math.max(26, W * H / 20000)));
    while (P.length < n) P.push({x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .45, vy: (Math.random() - .5) * .45, r: Math.random() * 1.5 + .7});
    P.length = n;
  }
  size(); var rt; addEventListener("resize", function(){ clearTimeout(rt); rt = setTimeout(size, 150); });
  addEventListener("pointermove", function(e){ mx = e.clientX; my = e.clientY; });
  addEventListener("pointerleave", function(){ mx = my = -999; });
  document.addEventListener("visibilitychange", function(){ vis = !document.hidden; if (vis) loop(); });
  var L = W < 520 ? 95 : 130;
  function loop(){
    if (!vis) return;
    x.clearRect(0, 0, W, H);
    for (var i = 0; i < P.length; i++) {
      var p = P[i]; p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > W) p.vx *= -1; if (p.y < 0 || p.y > H) p.vy *= -1;
      var dx = mx - p.x, dy = my - p.y, dm = Math.sqrt(dx * dx + dy * dy);
      if (dm < 160) { p.x -= dx * .004; p.y -= dy * .004; x.strokeStyle = "rgba(94,231,255," + (1 - dm / 160) * .55 + ")"; x.beginPath(); x.moveTo(p.x, p.y); x.lineTo(mx, my); x.stroke(); }
      x.fillStyle = "rgba(150,210,255,.85)"; x.beginPath(); x.arc(p.x, p.y, p.r, 0, 6.283); x.fill();
      for (var j = i + 1; j < P.length; j++) {
        var q = P[j], ax = p.x - q.x, ay = p.y - q.y, d = ax * ax + ay * ay;
        if (d < L * L) { x.strokeStyle = "rgba(94,160,255," + (1 - Math.sqrt(d) / L) * .28 + ")"; x.beginPath(); x.moveTo(p.x, p.y); x.lineTo(q.x, q.y); x.stroke(); }
      }
    }
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
</body>
