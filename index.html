/* ---- text ---- */
$("brand").textContent = SITE.brand; $("brand").setAttribute("data-t", SITE.brand);

else { var ri = 0; setTimeout(function f(){ role.textContent = rt.slice(0, ++ri); if (ri < rt.length) setTimeout(f, 38); }, 1000); }

/* ---- count-up numbers ---- */
function countUp(b){
  var txt = b.getAttribute("data-n"), m = /^([^\d]*)(\d[\d,]*\.?\d*)(.*)$/.exec(txt);
  if (!m || reduce) { b.textContent = txt; return; }
  var raw = m[2].replace(/,/g, ""), val = parseFloat(raw), dec = (raw.split(".")[1] || "").length, comma = m[2].indexOf(",") > -1;
  function fmt(v){ var s = v.toFixed(dec); if (comma){ var p = s.split("."); p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ","); s = p.join("."); } return m[1] + s + m[3]; }
  var t0 = performance.now(), D = 1400;

}

/* ---- build sections ---- */
if (typeof STATS !== "undefined") STATS.forEach(function(i, k){
  var d = el("div", "stat glass rv"); d.style.setProperty("--d", k * 120 + "ms");
  var b = el("b", "cnt", i.n); b.setAttribute("data-n", i.n); d.appendChild(b); d.appendChild(el("span", "", i.l)); $("stats").appendChild(d);
});
if (typeof SERVICES !== "undefined") {
  SERVICES.forEach(function(i, k){
    var d = el("div", "glass rv " + (k % 2 ? "r" : "l")); d.style.setProperty("--d", (k % 3) * 90 + "ms");
    d.appendChild(el("div", "no", (k + 1 < 10 ? "0" : "") + (k + 1)));
    var w = el("div"); w.appendChild(el("b", "", i.name)); w.appendChild(el("span", "t", i.desc)); d.appendChild(w); $("svc").appendChild(d);
  });
  var inner = el("div");
  for (var rep = 0; rep < 6; rep++) SERVICES.forEach(function(s){ inner.appendChild(document.createTextNode(s.name)); inner.appendChild(el("span", "", "✦")); });
  $("mq").appendChild(inner);
} else $("mq").style.display = "none";

var PAL = ["#22e4ff", "#ff3d9a", "#9b5cff", "#ffb43d", "#35f08a"];   /* used when a link has no colour in links.js */
LINKS.forEach(function(l, k){
  var c = el("div", "card glass rv"); c.style.setProperty("--d", (k % 3) * 100 + "ms"); c.style.setProperty("--c", l.color || PAL[k % PAL.length]);
  c.appendChild(el("div", "n", l.name)); if (l.desc) c.appendChild(el("div", "d", l.desc));
  var a = el("a", "btn", l.button || "Open"); a.href = l.url; a.target = "_blank"; a.rel = "noopener";
  a.appendChild(el("span", "arr", "→")); c.appendChild(a); $("links").appendChild(c);
});

/* ---- scroll reveal ---- */
var rvs = document.querySelectorAll(".rv");
function reveal(n){ n.classList.add("in"); var b = n.querySelector && n.querySelector(".cnt"); if (b) countUp(b); }
if ("IntersectionObserver" in window && !reduce) {
  var io = new IntersectionObserver(function(es){ es.forEach(function(e){ if (e.isIntersecting){ reveal(e.target); io.unobserve(e.target); } }); }, {threshold: .1});
  rvs.forEach(function(n){ io.observe(n); });
  setTimeout(function(){ rvs.forEach(function(n){ if (!n.classList.contains("in") && n.getBoundingClientRect().top < innerHeight) reveal(n); }); }, 2500);
} else rvs.forEach(reveal);

/* ---- logo: shrinks into the top-left corner while you scroll down, grows back (reversed) when you scroll up ---- */
var lgf = $("lg"), lgp = $("lgp"), nav = $("nav"), RANGE = 230, SMALL = 44, CX = 14, CY = 8;
function ease(t){ return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
var baseL = 0, baseT = 0, lastE = -1;
function measure(){ var r = lgp.getBoundingClientRect(); baseL = r.left; baseT = r.top + scrollY; lastE = -1; }   /* read the layout once, not on every scroll frame */
function logoUpdate(){
  var p = Math.min(1, Math.max(0, scrollY / RANGE)), e = ease(p);
  if (e === 1 && lastE === 1) return;
  var S = 1 + (SMALL / 150 - 1) * e, x = baseL + (CX - baseL) * e, y = (baseT - scrollY) + (CY - (baseT - scrollY)) * e;
  lgf.style.transform = "translate3d(" + x.toFixed(1) + "px," + y.toFixed(1) + "px,0) scale(" + S.toFixed(4) + ")";
  if (e !== lastE) { lgf.style.setProperty("--p", e.toFixed(3)); nav.style.setProperty("--p", e.toFixed(3)); }
  lastE = e;
}

/* ---- pointer effects (one rAF-throttled handler) ---- */
var raf = 0, px = 0, py = 0, tgt = null;
document.addEventListener("pointermove", function(e){ px = e.clientX; py = e.clientY; tgt = e.target; if (!raf) raf = requestAnimationFrame(frame); }, {passive: true});
function frame(){
  raf = 0;
  var g = tgt && tgt.closest && tgt.closest(".glass");
  if (g) { var r = g.getBoundingClientRect(); g.style.setProperty("--mx", (px - r.left) + "px"); g.style.setProperty("--my", (py - r.top) + "px");
    if (fine && g.classList.contains("card")) { g.style.setProperty("--ry", ((px - r.left) / r.width - .5) * 9 + "deg"); g.style.setProperty("--rx", -((py - r.top) / r.height - .5) * 9 + "deg"); } }
  if (fine) { var cu = $("cur"); cu.style.transform = "translate3d(" + px + "px," + py + "px,0)"; cu.classList.add("on"); }
  if (fine) { lgf.style.setProperty("--ry", (px / innerWidth - .5) * 28 + "deg"); lgf.style.setProperty("--rx", -(py / innerHeight - .5) * 28 + "deg"); }
}
document.addEventListener("pointerout", function(e){
  var c = e.target.closest && e.target.closest(".card"); if (c && !c.contains(e.relatedTarget)) { c.style.setProperty("--rx", "0deg"); c.style.setProperty("--ry", "0deg"); }
});

/* ---- sparks + ripple ---- */
document.addEventListener("click", function(e){
  var b = e.target.closest && e.target.closest(".btn"); if (!b || reduce) return;
  var r = b.getBoundingClientRect(), s = Math.max(r.width, r.height) * 2, p = el("span", "rip");
  p.style.cssText = "width:" + s + "px;height:" + s + "px;left:" + (e.clientX - r.left - s / 2) + "px;top:" + (e.clientY - r.top - s / 2) + "px"; b.appendChild(p); setTimeout(function(){ p.remove(); }, 650);
  var col = getComputedStyle(b).getPropertyValue("--c").trim() || "#3da0ff", cols = [col, "#5ee7ff", "#fff", "#ff5ccf", "#7846ff"];
  for (var i = 0; i < 14; i++) {
    var d = el("i", "sp"), a = Math.random() * 6.283, dist = 50 + Math.random() * 90;
    d.style.left = e.clientX + "px"; d.style.top = e.clientY + "px"; d.style.background = cols[i % cols.length];
    d.style.setProperty("--x", Math.cos(a) * dist + "px"); d.style.setProperty("--y", Math.sin(a) * dist + "px"); document.body.appendChild(d); setTimeout(function(x){ x.remove(); }, 800, d);
  }
});

/* ---- scroll: progress bar, back-to-top, logo ---- */
var up = $("up"), bar = $("bar"), sraf = 0;
function sc(){ sraf = 0; var h = document.documentElement.scrollHeight - innerHeight; bar.style.transform = "scaleX(" + (h > 0 ? scrollY / h : 0) + ")"; up.classList.toggle("on", scrollY > 500); logoUpdate(); }
addEventListener("scroll", function(){ if (!sraf) sraf = requestAnimationFrame(sc); }, {passive: true});
addEventListener("resize", function(){ measure(); if (!sraf) sraf = requestAnimationFrame(sc); });
addEventListener("load", function(){ measure(); sc(); }); measure(); sc();
up.addEventListener("click", function(){ scrollTo({top: 0, behavior: reduce ? "auto" : "smooth"}); });

/* ---- particle network: fewer dots on phones, stops when the tab is hidden ---- */
(function(){
  if (reduce) return;
  var c = $("net"), x = c.getContext("2d"), W, H, P = [], mx = -999, my = -999, dpr = Math.min(devicePixelRatio || 1, 1.5), vis = true, L = 120;
  function size(){
    W = innerWidth; H = innerHeight; c.width = W * dpr; c.height = H * dpr; c.style.width = W + "px"; c.style.height = H + "px"; x.setTransform(dpr, 0, 0, dpr, 0, 0);
    var small = W < 700, n = small ? 30 : Math.round(Math.min(64, Math.max(30, W * H / 22000))); L = small ? 90 : 125;
    while (P.length < n) P.push({x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .4, vy: (Math.random() - .5) * .4, r: Math.random() * 1.5 + .7});
    P.length = n;
  }
  size(); var rz; addEventListener("resize", function(){ clearTimeout(rz); rz = setTimeout(size, 150); });
  addEventListener("pointermove", function(e){ mx = e.clientX; my = e.clientY; }, {passive: true});
  document.addEventListener("visibilitychange", function(){ vis = !document.hidden; if (vis) loop(); });
  function loop(){
    if (!vis) return;
    x.clearRect(0, 0, W, H);
    for (var i = 0; i < P.length; i++) {
      var p = P[i]; p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > W) p.vx *= -1; if (p.y < 0 || p.y > H) p.vy *= -1;
      var dx = mx - p.x, dy = my - p.y, dm = Math.sqrt(dx * dx + dy * dy);
      if (dm < 160) { p.x -= dx * .004; p.y -= dy * .004; x.strokeStyle = "rgba(94,231,255," + (1 - dm / 160) * .55 + ")"; x.beginPath(); x.moveTo(p.x, p.y); x.lineTo(mx, my); x.stroke(); }
      x.fillStyle = i % 3 === 0 ? "rgba(255,90,170,.9)" : i % 3 === 1 ? "rgba(34,228,255,.9)" : "rgba(175,130,255,.9)"; x.beginPath(); x.arc(p.x, p.y, p.r, 0, 6.283); x.fill();
      for (var j = i + 1; j < P.length; j++) {
        var q = P[j], ax = p.x - q.x, ay = p.y - q.y, d = ax * ax + ay * ay;
        if (d < L * L) { x.strokeStyle = "rgba(175,120,255," + (1 - Math.sqrt(d) / L) * .3 + ")"; x.beginPath(); x.moveTo(p.x, p.y); x.lineTo(q.x, q.y); x.stroke(); }
      }
    }
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
</body>
