<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script type="application/ld+json">
{"@context":"https://schema.org","@type":"Person","name":"Eren","alternateName":"Eren Empire","url":"https://erenlabs.xyz/","jobTitle":"Web Developer and Telegram Bot Developer","sameAs":["https://t.me/erenygr58","https://t.me/erenempire"]}
</script>
<style>
:root{--bg:#05070f;--blue:#3da0ff;--cy:#5ee7ff;--tx:#e8f0ff;--mute:#9db0d3;--live:#35f08a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font:500 17px/1.55 "Space Grotesk",system-ui,sans-serif;background:var(--bg);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;
  background:radial-gradient(600px 400px at 15% 8%,rgba(40,110,255,.35),transparent 70%),
  radial-gradient(500px 380px at 90% 35%,rgba(94,231,255,.18),transparent 70%),
  radial-gradient(600px 450px at 20% 95%,rgba(120,70,255,.25),transparent 70%)}
.wrap{max-width:640px;margin:0 auto;padding:44px 18px 40px}
.top{text-align:center}
.logo{width:150px;height:150px;border-radius:50%;border:2px solid rgba(94,231,255,.7);box-shadow:0 0 0 6px rgba(61,160,255,.12),0 0 40px rgba(61,160,255,.6),0 0 90px rgba(61,160,255,.25);display:block;margin:0 auto 22px}
.nm{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(38px,11vw,60px);line-height:1.05;font-weight:700;letter-spacing:-.02em;
  background:linear-gradient(180deg,#fff 20%,#9fc6ff 60%,var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(61,160,255,.45))}
.live{display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 10px;border-radius:999px;font:500 13px "JetBrains Mono",monospace;color:var(--live);
  background:rgba(53,240,138,.1);border:1px solid rgba(53,240,138,.45);box-shadow:0 0 18px rgba(53,240,138,.35)}
.live i{width:9px;height:9px;border-radius:50%;background:var(--live);box-shadow:0 0 10px var(--live);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(53,240,138,.8)}70%{box-shadow:0 0 0 10px rgba(53,240,138,0)}100%{box-shadow:0 0 0 0 rgba(53,240,138,0)}}
.role{font:500 15px "JetBrains Mono",monospace;color:var(--cy);margin:14px 0 0}
.role::after{content:"_";animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.glass{background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.03));border:1px solid rgba(140,185,255,.22);border-radius:20px;
  -webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);
  box-shadow:0 8px 32px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.18)}
.about{padding:18px 20px;margin:26px 0;color:var(--mute)}
.about b{display:block;color:var(--tx);font-size:20px;margin-bottom:4px}
.about p{margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{padding:14px 10px;text-align:center}
.stat b{display:block;font-size:clamp(18px,5.5vw,26px);line-height:1.1;color:#fff;text-shadow:0 0 16px rgba(61,160,255,.8)}
.stat span{display:block;margin-top:4px;font-size:13px;color:var(--mute);line-height:1.3}
h2{font-size:clamp(22px,6vw,28px);margin:40px 0 14px;letter-spacing:-.01em}
#links{display:grid;gap:16px}
.card{--c:var(--blue);padding:18px 18px 16px;position:relative;border-color:color-mix(in srgb,var(--c) 45%,transparent)}
.card:hover{box-shadow:0 8px 32px rgba(0,0,0,.45),0 0 28px color-mix(in srgb,var(--c) 40%,transparent),inset 0 1px 0 rgba(255,255,255,.2)}
.card .n{font-size:21px;font-weight:700;line-height:1.2}
.card .d{color:var(--mute);margin:4px 0 14px;font-size:15.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:999px;text-decoration:none;color:#fff;font-weight:700;
  background:linear-gradient(145deg,color-mix(in srgb,var(--c) 85%,#fff 0%),color-mix(in srgb,var(--c) 40%,#000));
  border:1px solid rgba(255,255,255,.4);box-shadow:0 0 22px color-mix(in srgb,var(--c) 55%,transparent),inset 0 1px 0 rgba(255,255,255,.5);
  transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 34px color-mix(in srgb,var(--c) 80%,transparent),inset 0 1px 0 rgba(255,255,255,.6)}
.btn:active{transform:scale(.97)}
.svc{display:grid;gap:12px}
.svc div{padding:14px 18px}
.svc b{display:block;font-size:18px}
.svc span{color:var(--mute);font-size:15.5px}
:focus-visible{outline:3px solid var(--cy);outline-offset:3px}
footer{margin-top:44px;text-align:center;color:var(--mute);font-size:14px}
@media (max-width:480px){.stats{grid-template-columns:1fr}.stat{display:flex;align-items:baseline;gap:10px;text-align:left;padding:12px 16px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <img class="logo" src="logo.jpg" alt="Eren Empire logo" width="150" height="150">
    <div class="nm"><h1 id="brand">Eren Empire</h1><span class="live"><i></i>LIVE</span></div>
    <p class="role" id="title"></p>
  </header>
  <div class="about glass"><b id="name"></b><p id="about"></p></div>
  <div class="stats" id="stats"></div>
  <h2>Projects</h2>
  <nav id="links" aria-label="Links">
    <noscript><a class="btn" href="https://t.me/erenygr58">Message Me</a></noscript>
  </nav>
  <h2>What I build</h2>
  <div class="svc" id="svc"></div>
  <footer>© 2026 Eren Empire</footer>
</main>
<script src="links.js"></script>
<script>
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x)e.textContent=x;return e}
document.getElementById("brand").textContent=SITE.brand;
document.getElementById("title").textContent=SITE.title;
document.getElementById("name").textContent="Hi, I’m "+SITE.name;
document.getElementById("about").textContent=SITE.about;
STATS.forEach(function(i){var d=el("div","stat glass");d.appendChild(el("b","",i.n));d.appendChild(el("span","",i.l));document.getElementById("stats").appendChild(d)});
SERVICES.forEach(function(i){var d=el("div","glass");d.appendChild(el("b","",i.name));d.appendChild(el("span","",i.desc));document.getElementById("svc").appendChild(d)});
LINKS.forEach(function(l){
  var c=el("div","card glass"); if(l.color)c.style.setProperty("--c",l.color);
  c.appendChild(el("div","n",l.name)); if(l.desc)c.appendChild(el("div","d",l.desc));
  var a=el("a","btn",l.button||"Open"); a.href=l.url; a.target="_blank"; a.rel="noopener";
  c.appendChild(a); document.getElementById("links").appendChild(c);
});
</script>
</body>
</html>
